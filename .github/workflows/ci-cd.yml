name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  tests:
    name: Tests unitaires et validation du jeu d'évaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Les preuves du jeu d'évaluation sont dans le corpus
        run: python evaluation/dataset.py
      - name: Tests (sans modèle ni GPU)
        run: pytest -q

  corpus:
    name: Corpus reproductible depuis les sources figées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install requests python-dotenv
      - run: python ingestion/build_corpus.py
      - name: Aucun écart avec le corpus versionné
        run: git diff --exit-code -- corpus/

  docker:
    name: Image Docker
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build sur chaque PR (l'image doit rester constructible) ; publication (CD) uniquement
      # sur main et sur les tags v*.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Démarrage de l'API dans le conteneur
    needs: [docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: L'API démarre, construit son index et répond sur /health
        run: |
          IMAGE="${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"index_ready":true' || { docker logs api; exit 1; }
